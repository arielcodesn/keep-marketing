<title>Keep Reel Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky top bar with tabs; each tab is a view. Content comes from data.json (rebuilt by
   tools/build_dashboard.py); edits you make here (status, prompt overrides, notes, posted, views)
   are saved in the dashboard's database and survive every rebuild. */
:root{
  --bg:#f3f3f0; --surface:#ffffff; --sunk:#ebebe6; --ink:#1c1b18; --muted:#66645d; --line:#deddd6;
  --accent:#dd7420; --accent-ink:#ffffff; --green:#24a33a; --ok:#2c8a56; --warn:#b97a12; --crit:#c8433a;
  --travel:#2a76c6; --storage:#cc4a2c; --funny:#a7780a; --fails:#7b4cc8; --life:#26907f;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141412; --surface:#1d1c1a; --sunk:#252421; --ink:#f0eee8; --muted:#a19e95; --line:#302f2b;
  --accent:#f08a35; --accent-ink:#1b1206; --green:#45c45a; --ok:#4fc184; --warn:#e2a43c; --crit:#f06b60;
  --travel:#5aa2ee; --storage:#f07558; --funny:#e0b33c; --fails:#ac86ee; --life:#4cc6b3; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141412; --surface:#1d1c1a; --sunk:#252421; --ink:#f0eee8; --muted:#a19e95; --line:#302f2b;
  --accent:#f08a35; --accent-ink:#1b1206; --green:#45c45a; --ok:#4fc184; --warn:#e2a43c; --crit:#f06b60;
  --travel:#5aa2ee; --storage:#f07558; --funny:#e0b33c; --fails:#ac86ee; --life:#4cc6b3; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-block:8px 64px}
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);padding-block:14px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font:800 26px/1.1 var(--display);letter-spacing:-.02em;margin:0}
.brand p{margin:0;color:var(--muted);font-size:14px}
.sync{margin-left:auto;font-size:12px;color:var(--muted)}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
nav a{white-space:nowrap;padding:9px 12px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;border-bottom:2px solid transparent}
nav a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav .n{font:500 11px var(--mono);color:var(--muted);margin-left:4px}
h2{font:700 20px/1.2 var(--display);letter-spacing:-.01em;margin:28px 0 12px;text-wrap:balance}
h3{font:700 16px/1.25 var(--body);margin:0}
.lede{color:var(--muted);margin:-6px 0 14px;max-width:72ch}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi b{display:block;font:800 30px/1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:13px}
.kpi.alert b{color:var(--crit)}
.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item>summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 14px;cursor:pointer}
.item>summary::-webkit-details-marker{display:none}
.item>summary:hover{background:var(--sunk)}
.item[open]>summary{background:var(--sunk)}
.item p.why{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.chev{font-size:12px;color:var(--muted);margin-left:6px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{display:inline-block;font:600 11.5px/1 var(--body);padding:5px 8px;border-radius:99px;white-space:nowrap;letter-spacing:.01em}
.p-first{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit)}
.p-green{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.p-up{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.p-nice{background:var(--sunk);color:var(--muted)}
.s-todo{background:var(--sunk);color:var(--muted)}
.s-gen{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.s-redo{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit)}
.s-done{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.swatch{width:12px;height:12px;border-radius:3px;margin-top:5px}
.need{font:500 12px var(--mono);color:var(--muted);text-align:right;white-space:nowrap}
.panel{padding:4px 14px 16px 38px;display:grid;gap:14px}
.ctrls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
select,textarea,input[type=number]{font:14px/1.45 var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
textarea{width:100%;resize:vertical}
textarea.prompt{font:12.5px/1.5 var(--mono);min-height:320px}
.btn{font:600 13px var(--body);border-radius:8px;padding:7px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:default}
.hint{font-size:12.5px;color:var(--muted)}
.edited{font:600 11px var(--body);color:var(--accent)}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.refs a{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:12px;text-decoration:none}
.refs img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:8px;background:var(--sunk);border:1px solid var(--line)}
.refs img.wide{aspect-ratio:4/3}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.reel{display:flex;flex-direction:column;gap:8px;min-width:0}
.reel video,.clip video{width:100%;aspect-ratio:9/16;max-width:100%;border-radius:10px;background:var(--sunk);display:block;object-fit:cover}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:1px}
.meta b{color:var(--ink);font-weight:600}
.num{font:500 12px var(--mono);color:var(--muted)}
.tagline{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font:700 11px var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--c)}
.hook{font-weight:700;line-height:1.3}
.punch{font-weight:600;color:var(--accent)}
.track{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;padding-top:6px;border-top:1px dashed var(--line)}
.track input[type=number]{width:84px;padding:4px 6px}
.track textarea{font-size:12.5px;padding:5px 7px;min-height:34px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 12px;font:600 13px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.clips{display:flex;flex-direction:column;gap:16px}
.clip{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13.5px;margin:10px 0}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
details.tlx{margin-top:8px}
details.tlx summary{cursor:pointer;font-weight:600;color:var(--accent)}
.sheet{width:100%;border-radius:8px;margin:10px 0;display:block}
.tl{width:100%;border-collapse:collapse;font-size:13px}
.tl td{padding:4px 8px 4px 0;border-top:1px solid var(--line);vertical-align:top}
.tl td:first-child{font:500 12px var(--mono);color:var(--muted);white-space:nowrap;width:44px}
.scroll{overflow-x:auto}
.bgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.bg img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px;display:block;background:var(--sunk)}
.bg a{color:var(--accent)}
.spec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.spec ul{margin:6px 0 0;padding-left:18px}
.spec li{margin:3px 0}
.plan{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.plan th{text-align:left;font:600 12px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:10px;border-bottom:1px solid var(--line)}
.plan td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
.plan td.d{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.st-made{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.st-ready{background:var(--sunk);color:var(--muted)}
.st-need{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit)}
.empty{color:var(--muted);padding:30px 0}
.cues{display:flex;gap:4px;flex-wrap:wrap}
.cue{font:500 11px var(--mono);background:var(--sunk);color:var(--muted);border-radius:6px;padding:3px 6px}
.tracks{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card p{margin:0;font-size:13.5px}
.card .k{font-size:12px;color:var(--muted)}
.card a{color:var(--accent)}
.sfx{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
audio{width:100%;height:36px}
.addform{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;align-items:end}
.addform input{font:14px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:600;font-size:13px;padding:8px 14px;border-radius:99px;z-index:20}
@media (max-width:760px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:minmax(0,1fr)}
  .clip{grid-template-columns:minmax(0,1fr)}
  .clip video{max-width:260px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .plan .hide-s{display:none}
  .panel{padding-left:14px}
  .item>summary,a.item{grid-template-columns:auto minmax(0,1fr)!important}
  .item .right{grid-column:2;flex-direction:row;align-items:center;flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Keep Reel Studio</h1><p>Hamster reels for Keep – Photo &amp; Video Cleaner</p><span class="sync" id="sync">Loading…</span></div>
    <nav id="nav" aria-label="Sections"></nav>
  </header>
  <main id="view"><p class="empty">Loading the studio…</p></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
// ---------- state ----------
let DATA = null;                 // from data.json
let EDITS = {clips:{}, reels:{}, tracks:{}, custom:{}}; // from the dashboard database
let db = null, canWrite = false;
let reelFilter = "all", planFilter = "all";
const openItems = new Set();

const STATUS = [["todo","To do","s-todo"],["generating","Generating","s-gen"],["redo","Needs a redo","s-redo"],["done","Done","s-done"]];
const NEED_KEY = {"sideeye":"sideeye","crying":"crying","panic":"panic","facepalm":"facepalm","laugh-green":"laugh",
  "shocked-green":"shocked","angry-green":"angry","sleepy-green":"sleepy","dance-green":"dance"};

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const pretty = n => n.replace(/_/g, " · ").replace(/-/g, " ");
const $ = id => document.getElementById(id);
function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,1800); }

// ---------- edits (database) ----------
const clipEdit = id => EDITS.clips[id] || {};
const reelEdit = id => EDITS.reels[id] || {};
const statusOf = id => clipEdit(id).status || "todo";
const promptOf = t => clipEdit(t.id).prompt || t.prompt;

async function saveEdit(coll, id, patch){
  if (!db || !canWrite) return;
  const cur = ({clip_requests: EDITS.clips, reel_tracking: EDITS.reels, track_notes: EDITS.tracks, tracks_custom: EDITS.custom}[coll] || {})[id] || {};
  const body = {...cur, ...patch, updatedAt: new Date().toISOString()};
  for (const k of Object.keys(body)) if (body[k] === null) delete body[k];
  try { await db.collection(coll).doc(id).set(body); toast("Saved"); }
  catch(e){ if (e && e.code === "invalid_argument") { canWrite = false; show(); toast("You can view this dashboard but not edit it"); } else toast("Couldn't save. Try again."); }
}

async function connect(){
  try { db = await window.claude?.use?.("db"); } catch(e) { db = null; }
  let user = null; try { user = await window.claude?.use?.("user"); } catch(e) {}
  if (!db){ $("sync").textContent = "Edits unavailable here"; return; }
  const w = user ? await user.can("data.write") : null;
  canWrite = w !== false;
  $("sync").textContent = canWrite ? "Edits save automatically" : "View only";
  let loaded = 0; const timer = setTimeout(() => { if (loaded < 4) $("sync").textContent = "Saved edits can't be reached yet"; }, 10000);
  const sub = (coll, key) => db.collection(coll).onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); });
    EDITS[key] = m; if (!snap.metadata.fromCache && ++loaded >= 4) clearTimeout(timer);
    if (!isTyping()) show();
  }, () => { clearTimeout(timer); $("sync").textContent = "Saved edits unavailable"; });
  sub("clip_requests", "clips"); sub("reel_tracking", "reels"); sub("track_notes", "tracks"); sub("tracks_custom", "custom");
}
const isTyping = () => { const a = document.activeElement; return a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT"); };

// ---------- views ----------
function views(){ return [
  ["overview","Overview"],["reels","Reels",DATA.reels.length],["clips","Base clips",DATA.clips.length],
  ["to-make","To make",DATA.tomake.filter(t=>statusOf(t.id)!=="done").length],["sounds","Sounds",DATA.sounds.length + DATA.trending.tracks.length],["backgrounds","Backgrounds",DATA.bgs.length],["plan","30-day plan",DATA.plan.length]]; }
function nav(cur){
  $("nav").innerHTML = views().map(([k,l,n]) => `<a href="#${k}" ${k===cur?'aria-current="page"':""}>${l}${n!=null?`<span class="n">${n}</span>`:""}</a>`).join("");
}
const video = (src, poster) => `<video controls playsinline preload="none" poster="${poster}" src="${src}"></video>`;
const P = () => DATA.pillars;
const sfxName = id => (DATA.sounds.find(s => s.id === id) || {name:id}).name;
const TRACK_STATUS = [["untested","Not tried yet"],["works","Works on our account"],["blocked","Not available to us"]];

function reelCard(r){
  const e = reelEdit(r.num);
  const track = db ? `<div class="track">
      <label><input type="checkbox" data-posted="${r.num}" ${e.posted?"checked":""} ${canWrite?"":"disabled"}> Posted</label>
      <label>Views <input type="number" min="0" inputmode="numeric" id="views-${r.num}" data-views="${r.num}" value="${e.views ?? ""}" ${canWrite?"":"disabled"}></label>
      <input type="text" id="rtrack-${r.num}" data-rtrack="${r.num}" value="${esc(e.track||"")}" placeholder="Track used in IG" style="font:12.5px var(--body);padding:5px 7px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);flex:1;min-width:120px" ${canWrite?"":"disabled"}>
      <textarea id="rnote-${r.num}" data-rnote="${r.num}" rows="1" placeholder="Notes" ${canWrite?"":"disabled"}>${esc(e.notes||"")}</textarea>
    </div>` : "";
  return `<article class="reel" style="--c:var(--${r.pillar})">
    ${video(`media/reels/${r.file}.mp4`, `media/posters/${r.file}.jpg`)}
    <div class="tagline"><span class="num">#${r.num}</span><span class="tag">${esc(P()[r.pillar])}</span>${e.posted?'<span class="pill s-done">Posted</span>':""}</div>
    <div class="hook">${esc(r.hook)}</div>
    ${r.punch?`<div class="punch">→ ${esc(r.punch)}</div>`:""}
    <div class="meta"><span>Hamster: <b>${esc(pretty(r.clip))}</b></span><span>Background: <b>${esc(r.bgname)}</b></span></div>
    ${r.sounds && r.sounds.length ? `<div class="cues">${r.sounds.map(c => `<span class="cue">🔊 ${esc(sfxName(c.sound))} ${c.at}s</span>`).join("")}</div>` : ""}
    ${track}
  </article>`;
}
function priorityPill(p){
  const cls = p==="Make first"?"p-first":p==="Remake on green"?"p-green":p.startsWith("Upload")?"p-up":"p-nice";
  return `<span class="pill ${cls}">${esc(p)}</span>`;
}
function statusPill(id){ const [k,l,c] = STATUS.find(s => s[0]===statusOf(id)); return `<span class="pill ${c}">${l}</span>`; }
const needCount = t => NEED_KEY[t.id] ? (DATA.emotion_need[NEED_KEY[t.id]]||0) : 0;

function toMakeItem(t, full){
  const e = clipEdit(t.id), edited = !!e.prompt, dis = canWrite ? "" : "disabled";
  const panel = full ? `<div class="panel">
      <div class="ctrls">
        <label class="f" for="st-${t.id}">Status<select id="st-${t.id}" data-status="${t.id}" ${dis}>${STATUS.map(([k,l]) => `<option value="${k}" ${statusOf(t.id)===k?"selected":""}>${l}</option>`).join("")}</select></label>
        <span class="hint">Save the result as <span class="num">base-clips/${esc(t.file)}</span> · beat at ${esc(t.beat)}</span>
      </div>
      <div>
        <div class="ctrls" style="justify-content:space-between;margin-bottom:6px">
          <span style="font-weight:700">10-second prompt ${edited?'<span class="edited">· your edit</span>':""}</span>
          <span class="ctrls"><button class="btn primary" data-copy="${t.id}">Copy prompt</button>
          ${db?`<button class="btn" data-save="${t.id}" ${dis}>Save edits</button><button class="btn" data-reset="${t.id}" ${edited&&canWrite?"":"disabled"}>Reset to default</button>`:""}</span>
        </div>
        <textarea class="prompt" id="pr-${t.id}" ${db&&canWrite?"":"readonly"}>${esc(promptOf(t))}</textarea>
      </div>
      <div><div style="font-weight:700;margin-bottom:6px">Reference images <span class="hint">· attach all of them to the generator</span></div>
        <div class="refs">${DATA.refs.map(r => `<a href="media/ref/${r.file}" target="_blank" rel="noopener"><img loading="lazy" class="${/closeup/.test(r.file)?"wide":""}" src="media/ref/${r.file}" alt="${esc(r.caption)}"><span>${esc(r.caption)}</span></a>`).join("")}</div></div>
      ${db?`<label class="f" for="nt-${t.id}">Notes<textarea id="nt-${t.id}" data-note="${t.id}" rows="2" placeholder="Which generator, what went wrong, links…" ${dis}>${esc(e.notes||"")}</textarea></label>`:""}
    </div>` : "";
  const head = `<span class="swatch" style="background:${t.kind==="new"?"var(--crit)":t.kind==="green"?"var(--green)":"var(--line)"}"></span>
      <div><h3>${esc(t.name)}<span class="chev">${full?(openItems.has(t.id)?"▲":"▼"):"→"}</span></h3><p class="why">${esc(t.why)}</p></div>
      <div class="right"><span class="badges">${statusPill(t.id)}${priorityPill(t.priority)}</span>${needCount(t)?`<span class="need">${needCount(t)} planned reels</span>`:""}</div>`;
  if (!full) return `<a class="item" href="#to-make" data-goto="${t.id}" style="display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:12px 14px;color:inherit;text-decoration:none">${head}</a>`;
  return `<details class="item" data-item="${t.id}" ${openItems.has(t.id)?"open":""}><summary>${head}</summary>${panel}</details>`;
}

const render = {
  overview(){
    const planMade = DATA.plan.filter(p => p.made.length).length;
    const blocked = DATA.plan.filter(p => p.new).length;
    const open = DATA.tomake.filter(t => statusOf(t.id)!=="done");
    const posted = DATA.reels.filter(r => reelEdit(r.num).posted).length;
    return `<div class="kpis">
        <div class="kpi"><b>${DATA.reels.length}</b><span>reels made${db?` · ${posted} posted`:""}</span></div>
        <div class="kpi"><b>${DATA.clips.length}</b><span>base clips · ${DATA.clips.filter(c=>c.bgtype==="green").length} on green</span></div>
        <div class="kpi"><b>${planMade}<small style="font-size:16px;color:var(--muted)"> / ${DATA.plan.length}</small></b><span>plan ideas already made</span></div>
        <div class="kpi alert"><b>${blocked}</b><span>planned reels waiting on missing emotions</span></div>
      </div>
      <div class="two">
        <section><h2>Base clips to make next</h2>
          <p class="lede">Tap one to get its 10-second prompt and reference images.</p>
          <div class="list">${open.filter(t=>t.kind!=="variation").map(t => toMakeItem(t,false)).join("") || '<p class="empty" style="padding:14px">All done.</p>'}</div></section>
        <section><h2>Latest reels</h2><p class="lede">Previews at phone quality. Full-quality files are in the repo's reels/ folder.</p>
          <div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">${DATA.reels.slice(-4).reverse().map(reelCard).join("")}</div></section>
      </div>`;
  },
  reels(){
    const opts = [["all","All"], ...Object.entries(P()).filter(([k]) => DATA.reels.some(r=>r.pillar===k)), ["cutout","New background"], ["original","Original scene"]].concat(db?[["unposted","Not posted"]]:[]);
    const show = r => reelFilter==="all" || r.pillar===reelFilter || (reelFilter==="cutout" && r.bg) || (reelFilter==="original" && !r.bg) || (reelFilter==="unposted" && !reelEdit(r.num).posted);
    const rs = DATA.reels.filter(show);
    return `<h2>Reels</h2>${db?'<p class="lede">Tick Posted and add the view count after posting, so we can see which jokes work.</p>':""}
      <div class="chips">${opts.map(([k,l]) => `<button class="chip" data-rf="${k}" aria-pressed="${reelFilter===k}">${l}</button>`).join("")}</div>
      ${rs.length?`<div class="grid">${rs.map(reelCard).join("")}</div>`:'<p class="empty">No reels match this filter.</p>'}`;
  },
  clips(){
    const typeLabel = {green:["Green screen","p-green"],white:["White studio","p-nice"],scene:["Fixed scene","p-up"]};
    return `<h2>Base clips</h2><p class="lede">Each clip has a frame every half second. Open the timeline to see what the hamster does at each moment and where the beat lands.</p>
      <div class="clips">${DATA.clips.map(c => { const [tl,tc] = typeLabel[c.bgtype]; return `<article class="clip">
        ${video(`media/clips/${c.name}.mp4`, `media/posters/clip_${c.name}.jpg`)}
        <div style="min-width:0">
          <div class="badges"><span class="pill ${tc}">${tl}</span>${c.reels.length?`<span class="pill p-nice">${c.reels.length} reel${c.reels.length>1?"s":""} made</span>`:""}</div>
          <h3 style="margin-top:8px;font:700 18px/1.25 var(--display)">${esc(pretty(c.name))}</h3>
          <p style="margin:4px 0 0">${esc(c.summary)}</p>
          <dl class="facts"><dt>Beat</dt><dd>${esc(c.beat)}</dd><dt>Cutout</dt><dd>${esc(c.cutout)}</dd>
            <dt>Framing</dt><dd>${esc(c.framing)}</dd><dt>Good for</dt><dd>${esc(c.use)}</dd></dl>
          <details class="tlx"><summary>Timeline, every 0.5 s</summary>
            <div class="scroll"><img class="sheet" loading="lazy" src="media/sheets/${c.name}.jpg" alt="Frames of ${esc(c.name)} every half second" style="min-width:560px"></div>
            <table class="tl">${c.rows.map(([t,d]) => `<tr><td>${t}s</td><td>${esc(d).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}</td></tr>`).join("")}</table>
          </details>
        </div></article>`; }).join("")}</div>`;
  },
  "to-make"(){
    const groups = ["Make first","Remake on green","Upload if you have it","Nice to have"];
    return `<h2>Base clips to make</h2><p class="lede">Open a clip for its 10-second prompt and the reference images. Every prompt shares one character description, so the hamster, the cap logo and the “Keep” shirt stay the same in every clip.${db&&canWrite?" Edit a prompt and press Save edits to keep your version; Reset brings back the default.":""}</p>
      ${groups.map(g => { const items = DATA.tomake.filter(t=>t.priority===g); return items.length?`<h2 style="font-size:16px;margin-top:20px">${g}</h2><div class="list">${items.map(t=>toMakeItem(t,true)).join("")}</div>`:""; }).join("")}
      <h2>Checklist for every clip</h2>
      <div class="spec"><ul>
        <li>Attach all six reference images; generate at 9:16, 10 seconds.</li>
        <li>Check the cap logo (two stacked photo frames, red heart) and the white “Keep” on the shirt before keeping a take.</li>
        <li>Green must be flat with no shadows; the hamster must not touch the frame edges.</li>
        <li>Upload to the repo's <b>base-clips/</b> folder with the suggested name, then set the status to Done.</li>
      </ul></div>`;
  },
  sounds(){
    const tr = DATA.trending, dis = canWrite ? "" : "disabled";
    const trackCard = (t, custom) => { const n = (custom ? EDITS.custom[t.id] : EDITS.tracks[t.id]) || {}; const st = custom ? (t.status||"untested") : (n.status||"untested");
      const coll = custom ? "tracks_custom" : "track_notes";
      return `<article class="card">
        <div class="badges"><span class="pill ${t.kind==="Evergreen meme"?"p-up":custom?"p-nice":"p-green"}">${esc(t.kind||"Added by you")}</span>${st==="works"?'<span class="pill s-done">Works for us</span>':st==="blocked"?'<span class="pill s-redo">Not available</span>':""}</div>
        <h3>${esc(t.title)}</h3>${t.artist?`<span class="k">${esc(t.artist)}</span>`:""}
        ${t.trend?`<p>${esc(t.trend)}</p>`:""}
        ${t.fit?`<p><b>Use it for:</b> ${esc(t.fit)}</p>`:""}
        ${t.source?`<span class="k"><a href="${t.source}" target="_blank" rel="noopener">Where this trend was reported</a></span>`:""}
        ${db?`<div class="ctrls"><select aria-label="Status of ${esc(t.title)}" data-tstatus="${t.id}" data-coll="${coll}" ${dis}>${TRACK_STATUS.map(([k,l]) => `<option value="${k}" ${st===k?"selected":""}>${l}</option>`).join("")}</select></div>
        <textarea rows="1" id="tn-${t.id}" data-tnote="${t.id}" data-coll="${coll}" placeholder="Notes: which reels, how it did" ${dis}>${esc((custom?t.notes:n.notes)||"")}</textarea>`:""}
      </article>`; };
    const custom = Object.entries(EDITS.custom).map(([id, d]) => ({id, ...d, kind: "Added by you"}));
    const cats = [...new Set(DATA.sounds.map(s => s.category))];
    return `<h2>Trending tracks</h2>
      <p class="lede">${esc(tr.note)} List checked ${esc(tr.checked)}. Our reels are exactly 10 seconds, with the punchline at the beat, so line the track's drop up with that moment. Turn our sound effects down rather than off, so the boom still lands under the music.</p>
      <div class="tracks">${tr.tracks.map(t => trackCard(t,false)).join("")}${custom.map(t => trackCard(t,true)).join("")}</div>
      ${db&&canWrite?`<h2 style="font-size:16px">Add a track you've seen trending</h2>
      <form class="addform" id="addtrack"><label class="f" for="nt-title">Track<input id="nt-title" required placeholder="Song or sound name"></label>
        <label class="f" for="nt-artist">Artist or creator<input id="nt-artist" placeholder="Optional"></label>
        <label class="f" for="nt-fit">Use it for<input id="nt-fit" placeholder="Which reels or emotions"></label>
        <button class="btn primary" type="submit">Add track</button></form>`:""}
      <h2>Our sound effects</h2>
      <p class="lede">Made from scratch for Keep, so they're free to use anywhere, ads included. Every reel already has them mixed in at its beat.</p>
      ${cats.map(c => `<h2 style="font-size:16px;margin-top:18px">${esc(c)}</h2><div class="sfx">${DATA.sounds.filter(s=>s.category===c).map(s => `<article class="card">
        <h3>${esc(s.name)} <span class="k">${s.seconds}s</span></h3>
        <audio controls preload="none" src="media/sounds/${s.id}.mp3"></audio>
        <p>${esc(s.description)}</p><p class="k">Best for: ${esc(s.use)}</p>
        <span class="k">${s.reels.length?`In reels ${s.reels.map(n=>"#"+n).join(", ")}`:"Not used yet"} · file <span class="num">sounds/sfx/${esc(s.id)}.wav</span></span>
      </article>`).join("")}</div>`).join("")}`;
  },
  backgrounds(){
    return `<h2>Backgrounds</h2><p class="lede">All free for commercial use. Add more to the repo's backgrounds/ folder.</p>
      <div class="bgs">${DATA.bgs.map(b => `<article class="bg">
        <img loading="lazy" src="media/bg/${b.key}.jpg" alt="${esc(b.name)}">
        <h3 style="margin-top:8px">${esc(b.name)}</h3>
        <div class="meta"><span>${esc(b.license)} · <a href="${b.url}" target="_blank" rel="noopener">source</a></span>
        <span>${b.used.length?`Used in ${b.used.map(u=>"#"+u.split("_")[2]).join(", ")}`:"Not used yet"}</span></div>
      </article>`).join("")}</div>`;
  },
  plan(){
    const opts = [["all","All"], ...Object.entries(P()), ["made","Made"], ["need","Needs a new clip"]];
    const show = p => planFilter==="all" || p.pillar===planFilter || (planFilter==="made" && p.made.length) || (planFilter==="need" && p.new);
    const rows = DATA.plan.filter(show);
    const status = p => p.made.length ? `<span class="pill st-made">Made · #${p.made.map(m=>m.split("_")[2]).join(", #")}</span>`
      : p.new ? `<span class="pill st-need">Needs ${esc(p.emotion)} clip</span>` : `<span class="pill st-ready">Ready to make</span>`;
    return `<h2>30-day plan</h2><p class="lede">5 reels a day, one per topic. The full checklist is plan/keep-30-day-reels.html in the repo.</p>
      <div class="chips">${opts.map(([k,l]) => `<button class="chip" data-pf="${k}" aria-pressed="${planFilter===k}">${l}</button>`).join("")}</div>
      <div class="scroll"><table class="plan"><thead><tr><th>Day</th><th>Reel</th><th class="hide-s">Hamster</th><th>Status</th></tr></thead><tbody>
      ${rows.map(p => `<tr style="--c:var(--${p.pillar})"><td class="d">D${String(p.day).padStart(2,"0")}</td>
        <td><span class="tag">${esc(P()[p.pillar])}</span><div class="hook" style="font-weight:600">${esc(p.hook)}</div>${p.punch?`<div class="punch" style="font-size:13px">→ ${esc(p.punch)}</div>`:""}</td>
        <td class="hide-s">${esc(p.emotion)}</td><td>${status(p)}</td></tr>`).join("")}
      </tbody></table></div>`;
  },
};

// ---------- wiring ----------
function current(){ const k = location.hash.slice(1); return render[k] ? k : "overview"; }
function show(){
  if (!DATA) return;
  const k = current(), y = window.scrollY;
  nav(k);
  $("view").innerHTML = render[k]();
  window.scrollTo(0, y);
  document.querySelectorAll("[data-rf]").forEach(b => b.onclick = () => { reelFilter = b.dataset.rf; show(); });
  document.querySelectorAll("[data-pf]").forEach(b => b.onclick = () => { planFilter = b.dataset.pf; show(); });
  document.querySelectorAll("[data-goto]").forEach(a => a.onclick = () => { openItems.add(a.dataset.goto); });
  document.querySelectorAll("details[data-item]").forEach(d => d.ontoggle = () => {
    d.open ? openItems.add(d.dataset.item) : openItems.delete(d.dataset.item);
    const ch = d.querySelector(".chev"); if (ch) ch.textContent = d.open ? "▲" : "▼";
  });
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
    const ta = $("pr-" + b.dataset.copy);
    try { await navigator.clipboard.writeText(ta.value); toast("Prompt copied"); }
    catch(e){ ta.focus(); ta.select(); toast("Selected. Press Ctrl/Cmd+C to copy"); }
  });
  document.querySelectorAll("[data-save]").forEach(b => b.onclick = () => {
    const id = b.dataset.save, t = DATA.tomake.find(x => x.id === id), v = $("pr-" + id).value;
    saveEdit("clip_requests", id, {prompt: v.trim() === t.prompt.trim() ? null : v});
  });
  document.querySelectorAll("[data-reset]").forEach(b => b.onclick = () => saveEdit("clip_requests", b.dataset.reset, {prompt: null}));
  document.querySelectorAll("[data-status]").forEach(s => s.onchange = () => saveEdit("clip_requests", s.dataset.status, {status: s.value}));
  document.querySelectorAll("[data-note]").forEach(n => n.onchange = () => saveEdit("clip_requests", n.dataset.note, {notes: n.value}));
  document.querySelectorAll("[data-posted]").forEach(c => c.onchange = () => saveEdit("reel_tracking", c.dataset.posted, {posted: c.checked}));
  document.querySelectorAll("[data-views]").forEach(i => i.onchange = () => saveEdit("reel_tracking", i.dataset.views, {views: i.value === "" ? null : Number(i.value)}));
  document.querySelectorAll("[data-rnote]").forEach(n => n.onchange = () => saveEdit("reel_tracking", n.dataset.rnote, {notes: n.value}));
  document.querySelectorAll("[data-rtrack]").forEach(n => n.onchange = () => saveEdit("reel_tracking", n.dataset.rtrack, {track: n.value}));
  document.querySelectorAll("[data-tstatus]").forEach(s => s.onchange = () => saveEdit(s.dataset.coll, s.dataset.tstatus, {status: s.value}));
  document.querySelectorAll("[data-tnote]").forEach(n => n.onchange = () => saveEdit(n.dataset.coll, n.dataset.tnote, {notes: n.value}));
  const f = $("addtrack"); if (f) f.onsubmit = async ev => { ev.preventDefault();
    const title = $("nt-title").value.trim(); if (!title) return;
    const id = title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60) + "-" + Date.now().toString(36);
    await saveEdit("tracks_custom", id, {title, artist: $("nt-artist").value.trim(), fit: $("nt-fit").value.trim(), status: "untested"}); };
}
window.addEventListener("hashchange", () => { show(); window.scrollTo(0,0); });
document.addEventListener("focusout", () => setTimeout(() => { if (!isTyping()) show(); }, 0));

fetch("data.json").then(r => r.json()).then(d => { DATA = d; show(); connect(); })
  .catch(() => { $("view").innerHTML = '<p class="empty">Couldn\'t load the studio data. Reload the page to try again.</p>'; });
</script>
